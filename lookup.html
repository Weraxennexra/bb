<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexyn Services — UID Sorgu</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0a0a0a; color: #e0e0e0;
    min-height: 100vh; padding: 32px 16px;
    background-image:
      radial-gradient(circle at 15% 15%, rgba(100,100,100,0.1) 0%, transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(60,60,60,0.1) 0%, transparent 40%);
  }
  .wrap { max-width: 850px; margin: 0 auto; }
  
  .topbar {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 24px; padding: 0 4px;
  }
  .logo {
    font-size: 1.4rem; font-weight: 700; letter-spacing: 0.5px;
    background: linear-gradient(90deg, #fff, #888);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .top-right { display: flex; align-items: center; gap: 16px; }
  
  .stats-badge {
    background: #141414; border: 1px solid #2a2a2a;
    padding: 8px 14px; border-radius: 8px;
    font-size: 0.85rem; color: #aaa;
    display: flex; gap: 12px;
  }
  .stats-badge span { color: #fff; font-weight: 600; }
  
  .logout {
    background: transparent; border: 1px solid #333;
    color: #888; padding: 8px 16px; border-radius: 8px;
    cursor: pointer; font-size: 0.85rem; transition: all 0.2s;
  }
  .logout:hover { border-color: #666; color: #fff; background: #1a1a1a; }

  .panel {
    background: #141414; border: 1px solid #2a2a2a;
    border-radius: 16px; padding: 32px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
    margin-bottom: 24px;
    position: relative; overflow: hidden;
  }
  .panel::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
  }

  h2 { font-size: 1.1rem; margin-bottom: 20px; color: #e0e0e0; font-weight: 600; }
  
  .input-group { display: flex; gap: 12px; margin-bottom: 16px; }
  input[type="text"] {
    flex: 1; padding: 16px 20px;
    background: #0d0d0d; border: 1px solid #333;
    border-radius: 12px; color: #fff;
    font-size: 1rem; font-family: 'Courier New', monospace;
    outline: none; transition: all 0.2s;
  }
  input:focus { border-color: #666; box-shadow: 0 0 0 4px rgba(120,120,120,0.1); background: #111; }
  input::placeholder { color: #555; }
  
  button.action {
    padding: 16px 32px;
    background: linear-gradient(135deg, #444, #222);
    border: 1px solid #555; border-radius: 12px;
    color: #fff; font-weight: 600; font-size: 1rem;
    cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; gap: 8px;
  }
  button.action:hover { background: linear-gradient(135deg, #555, #333); border-color: #777; transform: translateY(-1px); }

  .result {
    background: #111; border: 1px solid #2e2e2e;
    border-radius: 12px; padding: 24px;
    font-size: 0.92rem; color: #666;
    min-height: 100px; animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  
  .result.valid { border-color: #3a5a3a; background: linear-gradient(180deg, rgba(40,70,40,0.1) 0%, #111 100%); }
  .result.invalid { border-color: #5a3a3a; background: linear-gradient(180deg, rgba(70,40,40,0.1) 0%, #111 100%); }
  
  .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 16px; }
  .badge { padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
  .badge.ok { background: rgba(45,90,45,0.4); color: #a8e6a8; border: 1px solid #4a7c4a; }
  .badge.no { background: rgba(90,45,45,0.4); color: #e6a8a8; border: 1px solid #7c4a4a; }
  
  .copy-btn {
    background: transparent; border: 1px solid #444; color: #888;
    padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; transition: 0.2s;
  }
  .copy-btn:hover { background: #222; color: #fff; }

  /* Profil Kartı */
  .profile-card {
    display: flex; gap: 24px; align-items: center;
    background: #0a0a0a; border: 1px solid #222; 
    border-radius: 12px; padding: 24px; margin-bottom: 20px;
  }
  .avatar {
    width: 80px; height: 80px; border-radius: 50%;
    background: #222; border: 2px solid #444;
    object-fit: cover; flex-shrink: 0;
  }
  .profile-info h3 { color: #fff; font-size: 1.3rem; margin-bottom: 6px; font-weight: 600; }
  .profile-info p { color: #888; font-size: 0.85rem; }
  
  /* Izgara */
  .grid-stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;
  }
  .stat-box {
    background: #0a0a0a; border: 1px solid #222; border-radius: 8px; padding: 14px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .stat-label { color: #777; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
  .stat-val { color: #e0e0e0; font-family: 'Courier New', monospace; font-size: 0.95rem; font-weight: bold; word-break: break-all;}
  .stat-val.blue { color: #8ab4f8; }
  .stat-val.green { color: #a8e6a8; }

  .footer { margin-top: 24px; text-align: center; font-size: 0.8rem; color: #444; }
  
  @media (max-width: 600px) {
    .input-group { flex-direction: column; }
    .panel { padding: 24px 20px; }
    .profile-card { flex-direction: column; text-align: center; }
    .grid-stats { grid-template-columns: 1fr; }
    .topbar { flex-direction: column; gap: 16px; align-items: flex-start; }
    .top-right { width: 100%; justify-content: space-between; }
  }
</style>
</head>
<body>
<div class="wrap">
  
  <div class="topbar">
    <div class="logo">Nexyn Services</div>
    <div class="top-right">
      <div class="stats-badge" id="statsBadge">
        Key: <span id="keyTime">Hesaplanıyor...</span> | Sorgu: <span id="queryCount">0</span>
      </div>
      <button class="logout" onclick="logout()">Çıkış</button>
    </div>
  </div>

  <div class="panel">
    <h2>UID Sorgulama</h2>
    <div class="input-group">
      <input type="text" id="uidInput" placeholder="Sorgulamak istediğiniz UID'yi girin (örn: 128430427)" autocomplete="off">
      <button class="action" onclick="lookupUID()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        Sorgula
      </button>
    </div>
  </div>

  <div class="result" id="result">
    <div style="text-align:center; padding: 20px 0; color: #555;">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom:10px; opacity:0.5;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <br>Bir UID girerek sorgulama yapabilirsiniz.
    </div>
  </div>

  <div class="footer">© 2026 Nexyn Services</div>
</div>

<script>
  const KEY = sessionStorage.getItem('nexyn_key');
  if (!KEY) {
    alert('Önce key girmelisiniz.');
    location.href = '/index.html';
  }

  let totalQueries = 0;
  let lastDataJSON = null;

  function updateTimeLabel(ms) {
    const hours = Math.floor(ms / 3600000);
    const mins = Math.floor((ms % 3600000) / 60000);
    document.getElementById('keyTime').textContent = `${hours}s ${mins}dk`;
  }

  function logout() {
    sessionStorage.removeItem('nexyn_key');
    location.href = '/index.html';
  }

  function copyResult() {
    if (!lastDataJSON) return;
    navigator.clipboard.writeText(lastDataJSON).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'Kopyalandi';
      btn.style.color = '#a8e6a8';
      setTimeout(() => { btn.textContent = 'JSON Kopyala'; btn.style.color = ''; }, 2000);
    });
  }

  // API'den ne gelirse gelsin derinlemesine arayıp bulma fonksiyonu
  function findDeep(obj, keys) {
    let result = {};
    for (let k in obj) {
      if (keys.includes(k.toLowerCase()) && (typeof obj[k] === 'string' || typeof obj[k] === 'number')) {
        result[k.toLowerCase()] = obj[k];
      }
      if (typeof obj[k] === 'object' && obj[k] !== null) {
        const sub = findDeep(obj[k], keys);
        result = { ...result, ...sub }; // Alt objelerden geleni birleştir
      }
    }
    return result;
  }

  async function lookupUID() {
    const uid = document.getElementById('uidInput').value.trim();
    const result = document.getElementById('result');
    if (!uid || !/^\d+$/.test(uid)) {
      result.className = 'result invalid';
      result.innerHTML = '<div class="result-header"><span class="badge no">Hata</span></div><span style="color:#e6a8a8; display:inline-block;">Geçerli bir UID girin (sadece rakam).</span>';
      return;
    }

    result.className = 'result';
    result.innerHTML = '<div style="text-align:center; padding:20px; color:#888;">Sorgulanıyor...</div>';

    try {
      const r = await fetch('/api/uid-lookup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ uid, key: KEY })
      });
      const data = await r.json();
      
      if (!r.ok) {
        result.className = 'result invalid';
        result.innerHTML = `<div class="result-header"><span class="badge no">Hata</span></div><div style="color:#e6a8a8; text-align:center;">${data.error || 'Bilinmeyen hata'}</div>`;
        return;
      }

      totalQueries++;
      document.getElementById('queryCount').textContent = totalQueries;
      updateTimeLabel(data.remainingMs);
      lastDataJSON = JSON.stringify(data.data, null, 2);

      // Bütün JSON'un içine dal ve aradığımız anahtarları bul
      const searchKeys = ['nickname', 'name', 'id', 'country', 'devicemodel', 'devicesystem', 'platform', 'createtime', 'production_channelid', 'src'];
      const rawFound = findDeep(data, searchKeys);

      // Bulunan verileri düzenle (yoksa ekrana yazdırma)
      const hasNickname = rawFound.nickname || rawFound.name;
      const fbId = rawFound.id;
      const country = rawFound.country;
      const deviceModel = rawFound.devicemodel;
      const deviceSystem = rawFound.devicesystem;
      const platform = rawFound.platform;
      const createTime = rawFound.createtime;
      const channelId = rawFound.production_channelid;
      let avatarUrl = rawFound.src;

      // Avatar belirleme
      if (!avatarUrl) {
        const safeName = hasNickname ? encodeURIComponent(hasNickname) : 'User';
        avatarUrl = `https://ui-avatars.com/api/?name=${safeName}&background=222&color=fff&size=100`;
      }

      // Gösterilecek kutucukları hazırla (Eğer veri yoksa listeye ekleme)
      let gridHtml = '';
      const addBox = (label, value, colorClass = '') => {
        if (value && value !== 'undefined' && value !== 'null' && value !== '') {
          gridHtml += `
            <div class="stat-box">
              <span class="stat-label">${label}</span>
              <span class="stat-val ${colorClass}">${value}</span>
            </div>
          `;
        }
      };

      addBox('Sorgulanan UID', data.uid || uid, 'blue');
      addBox('Normalize UID', rawFound.normalized_uid || (data.data && data.data.normalized_uid), 'blue');
      addBox('Kanal ID', channelId, 'blue');
      addBox('Oluşturulma Tarihi', createTime, '');
      addBox('Facebook ID', fbId, 'blue');
      addBox('Platform', platform, '');
      addBox('Ülke', country, 'green');
      addBox('Cihaz Modeli', deviceModel, '');
      addBox('İşletim Sistemi', deviceSystem, '');

      // Eğer hiçbir veri bulunamadıysa
      if (gridHtml === '') {
        gridHtml = '<div style="grid-column: 1 / -1; text-align:center; color:#777; padding:20px;">Bu UID için detaylı bilgi bulunamadı.</div>';
      }

      let html = `
        <div class="result-header">
          <span class="badge ok">Sonuç Bulundu</span>
          <button class="copy-btn" id="copyBtn" onclick="copyResult()">JSON Kopyala</button>
        </div>
        
        <div class="profile-card">
          <img src="${avatarUrl}" class="avatar" alt="Avatar" onerror="this.src='https://ui-avatars.com/api/?name=User&background=222&color=fff'">
          <div class="profile-info">
            <h3>${hasNickname || 'İsimsiz Kullanıcı'}</h3>
            <p>${country ? 'Konum: ' + country : 'Konum Bilinmiyor'}</p>
          </div>
        </div>

        <div class="grid-stats">
          ${gridHtml}
        </div>
      `;

      result.className = 'result valid';
      result.innerHTML = html;
    } catch (e) {
      result.className = 'result invalid';
      result.innerHTML = '<div class="result-header"><span class="badge no">Hata</span></div><div style="color:#e6a8a8; text-align:center;">Sunucuya ulaşılamadı veya veri okunamadı.</div>';
    }
  }

  document.getElementById('uidInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') lookupUID();
  });
</script>
</body>
</html>
